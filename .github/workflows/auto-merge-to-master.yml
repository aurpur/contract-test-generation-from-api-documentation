name: Auto Merge to Master

# Déclenché à chaque merge dans develop
on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  create-and-merge-pr:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Check if PR already exists
        id: check_pr
        run: |
          PR_NUMBER=$(gh pr list --base master --head develop --state open --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            echo "pr_exists=false" >> $GITHUB_OUTPUT
            echo "No existing PR found"
          else
            echo "pr_exists=true" >> $GITHUB_OUTPUT
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "Existing PR found: #$PR_NUMBER"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create Pull Request
        if: steps.check_pr.outputs.pr_exists == 'false'
        id: create_pr
        run: |
          # Récupérer les derniers commits de develop
          COMMITS=$(git log master..develop --pretty=format:"- %s (%h)" --max-count=10)
          
          # Créer le corps du PR
          PR_BODY=$(cat <<EOF
          ## 🚀 Merge automatique de develop vers master
          
          Ce PR contient les derniers changements de la branche \`develop\` prêts pour la production.
          
          ### 📋 Derniers commits inclus:
          
          $COMMITS
          
          ### ✅ Vérifications automatiques
          
          - [ ] Tests unitaires passés
          - [ ] Documentation à jour
          - [ ] Aucun conflit détecté
          
          ---
          
          **Auteur**: Aurel IKAMA HONEY
          **Créé automatiquement** par GitHub Actions
          EOF
          )
          
          # Créer le PR
          PR_URL=$(gh pr create \
            --base master \
            --head develop \
            --title "chore: Auto-merge develop to master" \
            --body "$PR_BODY" \
            --label "automated" \
            --label "release")
          
          PR_NUMBER=$(echo $PR_URL | grep -oP '\d+$')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "Created PR #$PR_NUMBER: $PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Wait for checks to complete
        id: wait_checks
        run: |
          if [ "${{ steps.check_pr.outputs.pr_exists }}" == "true" ]; then
            PR_NUMBER=${{ steps.check_pr.outputs.pr_number }}
          else
            PR_NUMBER=${{ steps.create_pr.outputs.pr_number }}
          fi
          
          echo "Waiting for checks on PR #$PR_NUMBER..."
          
          # Attendre jusqu'à 10 minutes pour les checks
          MAX_ATTEMPTS=60
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS"
            
            # Récupérer le statut des checks
            CHECK_STATUS=$(gh pr view $PR_NUMBER --json statusCheckRollup --jq '.statusCheckRollup[]? | select(.status != "COMPLETED") | .status' | wc -l)
            
            if [ "$CHECK_STATUS" -eq 0 ]; then
              # Tous les checks sont complétés, vérifier le résultat
              FAILED_CHECKS=$(gh pr view $PR_NUMBER --json statusCheckRollup --jq '.statusCheckRollup[]? | select(.conclusion == "FAILURE" or .conclusion == "CANCELLED") | .name' | wc -l)
              
              if [ "$FAILED_CHECKS" -eq 0 ]; then
                echo "all_checks_passed=true" >> $GITHUB_OUTPUT
                echo "✅ All checks passed!"
                exit 0
              else
                echo "all_checks_passed=false" >> $GITHUB_OUTPUT
                echo "❌ Some checks failed"
                gh pr view $PR_NUMBER --json statusCheckRollup --jq '.statusCheckRollup[]? | select(.conclusion == "FAILURE" or .conclusion == "CANCELLED") | "\(.name): \(.conclusion)"'
                exit 0
              fi
            fi
            
            echo "Checks still running... waiting 10s"
            sleep 10
          done
          
          echo "all_checks_passed=timeout" >> $GITHUB_OUTPUT
          echo "⏱️ Timeout waiting for checks"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Verify no conflicts
        id: check_conflicts
        run: |
          if [ "${{ steps.check_pr.outputs.pr_exists }}" == "true" ]; then
            PR_NUMBER=${{ steps.check_pr.outputs.pr_number }}
          else
            PR_NUMBER=${{ steps.create_pr.outputs.pr_number }}
          fi
          
          # Vérifier s'il y a des conflits
          MERGEABLE=$(gh pr view $PR_NUMBER --json mergeable --jq '.mergeable')
          
          if [ "$MERGEABLE" == "MERGEABLE" ]; then
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
            echo "✅ No conflicts detected"
          else
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            echo "❌ Conflicts detected"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Auto-merge PR
        if: |
          steps.wait_checks.outputs.all_checks_passed == 'true' &&
          steps.check_conflicts.outputs.has_conflicts == 'false'
        run: |
          if [ "${{ steps.check_pr.outputs.pr_exists }}" == "true" ]; then
            PR_NUMBER=${{ steps.check_pr.outputs.pr_number }}
          else
            PR_NUMBER=${{ steps.create_pr.outputs.pr_number }}
          fi
          
          echo "🚀 Auto-merging PR #$PR_NUMBER..."
          
          # Merger le PR
          gh pr merge $PR_NUMBER \
            --merge \
            --delete-branch=false \
            --subject "chore: Auto-merge develop to master" \
            --body "Merged automatically after all checks passed ✅"
          
          echo "✅ Successfully merged PR #$PR_NUMBER to master"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Comment on PR if checks failed
        if: |
          steps.wait_checks.outputs.all_checks_passed == 'false' ||
          steps.check_conflicts.outputs.has_conflicts == 'true'
        run: |
          if [ "${{ steps.check_pr.outputs.pr_exists }}" == "true" ]; then
            PR_NUMBER=${{ steps.check_pr.outputs.pr_number }}
          else
            PR_NUMBER=${{ steps.create_pr.outputs.pr_number }}
          fi
          
          COMMENT="## ⚠️ Auto-merge bloqué\n\n"
          
          if [ "${{ steps.wait_checks.outputs.all_checks_passed }}" == "false" ]; then
            COMMENT="${COMMENT}❌ **Certains checks ont échoué**\n\n"
            COMMENT="${COMMENT}Veuillez corriger les erreurs avant le merge.\n\n"
          fi
          
          if [ "${{ steps.check_conflicts.outputs.has_conflicts }}" == "true" ]; then
            COMMENT="${COMMENT}❌ **Conflits détectés**\n\n"
            COMMENT="${COMMENT}Veuillez résoudre les conflits manuellement.\n\n"
          fi
          
          COMMENT="${COMMENT}---\n**Action automatique** - GitHub Actions"
          
          gh pr comment $PR_NUMBER --body "$COMMENT"
          
          echo "⚠️ Auto-merge blocked - comment added to PR #$PR_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Summary
        if: always()
        run: |
          echo "## 📊 Auto-Merge Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check_pr.outputs.pr_exists }}" == "true" ]; then
            PR_NUMBER=${{ steps.check_pr.outputs.pr_number }}
            echo "📝 **Existing PR**: #$PR_NUMBER" >> $GITHUB_STEP_SUMMARY
          else
            PR_NUMBER=${{ steps.create_pr.outputs.pr_number }}
            echo "🆕 **Created PR**: #$PR_NUMBER" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.wait_checks.outputs.all_checks_passed }}" == "true" ]; then
            echo "✅ All checks passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.wait_checks.outputs.all_checks_passed }}" == "false" ]; then
            echo "❌ Some checks failed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.wait_checks.outputs.all_checks_passed }}" == "timeout" ]; then
            echo "⏱️ Timeout waiting for checks" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.check_conflicts.outputs.has_conflicts }}" == "true" ]; then
            echo "❌ Conflicts detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No conflicts" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.wait_checks.outputs.all_checks_passed }}" == "true" ] && [ "${{ steps.check_conflicts.outputs.has_conflicts }}" == "false" ]; then
            echo "🎉 **PR auto-merged successfully!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Auto-merge blocked - manual intervention required**" >> $GITHUB_STEP_SUMMARY
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
