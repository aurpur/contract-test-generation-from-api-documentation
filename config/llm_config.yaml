# LLM Configuration
llm:
  models:
    gpt4:
      provider: openai
      model: gpt-4-turbo-preview
      temperature: 0.2
      max_tokens: 4096
    
    claude:
      provider: anthropic
      model: claude-3-sonnet-20240229
      temperature: 0.2
      max_tokens: 4096
    
    gemini:
      provider: google
      model: gemini-pro
      temperature: 0.2
      max_tokens: 4096
    
    mistral:
      provider: ollama
      model: mistral:latest
      temperature: 0.2
      max_tokens: 4096
      base_url: http://localhost:11434
    
    llama31:
      provider: ollama
      model: llama3.1:latest
      temperature: 0.2
      max_tokens: 4096
      base_url: http://localhost:11434
    
    llama32:
      provider: ollama
      model: llama3.2:latest
      temperature: 0.2
      max_tokens: 4096
      base_url: http://localhost:11434

    # Additional local Ollama models for RQ4 multi-model comparison
    # (keep these reasonably sized to allow practical experimentation)
    qwen25_coder_7b:
      provider: ollama
      model: qwen2.5-coder:7b
      temperature: 0.2
      max_tokens: 4096
      base_url: http://localhost:11434

    qwen25_7b:
      provider: ollama
      model: qwen2.5:7b
      temperature: 0.2
      max_tokens: 4096
      base_url: http://localhost:11434

    gemma2_9b:
      provider: ollama
      model: gemma2:9b
      temperature: 0.2
      max_tokens: 4096
      base_url: http://localhost:11434

    codellama_7b:
      provider: ollama
      model: codellama:7b
      temperature: 0.2
      max_tokens: 4096
      base_url: http://localhost:11434

  # Default model for each agent
  default_models:
    inductor: llama32
    oracle: llama32
    contractor: llama32
    runner: llama32
  
  # Consensus configuration for Oracle (uses multiple models)
  consensus:
    enabled: false  # Set to false to use single model (default_models.oracle)
    models: [mistral, llama31, llama32]  # Models to use when consensus is enabled
    threshold: 0.7  # 70% agreement required (0.5-1.0)

# Retry configuration
retry:
  max_attempts: 3
  backoff_factor: 2
  initial_delay: 1
