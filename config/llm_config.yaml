# ==============================================================================
# LLM Configuration - Local Ollama Models Only
# ==============================================================================
# Ce fichier configure les modèles LLM utilisés par les agents du projet.
# IMPORTANT: Seuls les modèles Ollama locaux sont utilisés (pas de cloud APIs).
#
# Modèles disponibles (installés via Ollama):
#   - deepseek-r1:8b       : Modèle de raisonnement avancé
#   - deepseek-coder-v2    : Spécialisé pour le code
#   - codellama:7b         : Meta's code-focused LLM
#   - qwen2.5:7b           : Modèle généraliste Alibaba
#   - qwen2.5-coder:7b     : Version code de Qwen
#   - llama3.2             : Meta's Llama 3.2
#   - llama3.1             : Meta's Llama 3.1
#   - mistral              : Mistral AI 7B
# ==============================================================================
llm:
  models:
    # === Modèles de raisonnement avancé ===
    deepseek_r1:
      provider: ollama
      model: deepseek-r1:8b
      temperature: 0.2
      max_tokens: 4096
      base_url: http://localhost:11434
    
    deepseek_coder:
      provider: ollama
      model: deepseek-coder-v2:latest
      temperature: 0.2
      max_tokens: 4096
      base_url: http://localhost:11434

    # === Modèles Meta Llama ===
    llama31:
      provider: ollama
      model: llama3.1:latest
      temperature: 0.2
      max_tokens: 4096
      base_url: http://localhost:11434
    
    llama32:
      provider: ollama
      model: llama3.2:latest
      temperature: 0.2
      max_tokens: 4096
      base_url: http://localhost:11434

    # === Modèle Mistral ===
    mistral:
      provider: ollama
      model: mistral:latest
      temperature: 0.2
      max_tokens: 4096
      base_url: http://localhost:11434

    # === Modèles Qwen (Alibaba) ===
    qwen25_coder_7b:
      provider: ollama
      model: qwen2.5-coder:7b
      temperature: 0.2
      max_tokens: 4096
      base_url: http://localhost:11434

    qwen25_7b:
      provider: ollama
      model: qwen2.5:7b
      temperature: 0.2
      max_tokens: 4096
      base_url: http://localhost:11434

    # === Modèle CodeLlama (Meta) ===
    codellama_7b:
      provider: ollama
      model: codellama:7b
      temperature: 0.2
      max_tokens: 4096
      base_url: http://localhost:11434

  # Modèles par défaut pour chaque agent
  # Ces modèles sont utilisés quand aucun modèle spécifique n'est demandé
  default_models:
    inductor: llama32      # Agent d'induction de contexte
    oracle: deepseek_r1    # Agent de génération d'oracles (raisonnement avancé)
    contractor: qwen25_coder_7b  # Agent de génération de contrats (code)
    runner: llama32        # Agent d'exécution de tests
  
  # Configuration du consensus pour l'OracleAgent
  # Quand activé, utilise plusieurs modèles pour valider les oracles
  consensus:
    enabled: false  # false = utilise default_models.oracle uniquement
    models: [deepseek_r1, mistral, llama32]  # Modèles pour le consensus
    threshold: 0.7  # 70% d'accord requis (0.5-1.0)

# Retry configuration
retry:
  max_attempts: 3
  backoff_factor: 2
  initial_delay: 1
