[mutmut]
# Chemins à tester (les mutations seront appliquées ici)
# Inclure tout src/ pour résoudre les dépendances internes
paths_to_mutate=src/

# Commande de test à exécuter pour valider chaque mutation  
# conftest.py configure automatiquement sys.path
# Tester uniquement les agents spécifiques (pas base_agent qui a des tests timing-sensibles)
runner=python -m pytest tests/test_agents/test_inductor.py tests/test_agents/test_oracle.py tests/test_parsers/ -x --tb=line

# Tests à exécuter (tous les tests par défaut)
tests_dir=tests/

# Fichiers de configuration
dict_synonyms=Struct, NamedStruct

[tool:pytest]
# Ignorer les scripts de dev qui ne sont pas des vrais tests
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --ignore=scripts/
