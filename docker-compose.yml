version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: contract-test-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contract_test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contract_test_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-contract_test_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - contract-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: contract-test-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - contract-test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  agents:
    build:
      context: .
      dockerfile: docker/Dockerfile.agents
    container_name: contract-test-agents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-contract_test}:${POSTGRES_PASSWORD:-contract_test_pwd}@postgres:5432/${POSTGRES_DB:-contract_test_db}
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./bruno_collections:/app/bruno_collections
      - ./generated_tests:/app/generated_tests
      - ./data:/app/data
      - ./experiments:/app/experiments
    networks:
      - contract-test-network

  java-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile.java
    container_name: contract-test-java-runner
    volumes:
      - ./generated_tests:/app
    networks:
      - contract-test-network
    profiles:
      - test

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: contract-test-mlflow
    ports:
      - "5000:5000"
    environment:
      - BACKEND_STORE_URI=postgresql://${POSTGRES_USER:-contract_test}:${POSTGRES_PASSWORD:-contract_test_pwd}@postgres:5432/${POSTGRES_DB:-contract_test_db}
      - ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    networks:
      - contract-test-network
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-contract_test}:${POSTGRES_PASSWORD:-contract_test_pwd}@postgres:5432/${POSTGRES_DB:-contract_test_db}
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000

  prometheus:
    image: prom/prometheus:latest
    container_name: contract-test-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - contract-test-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    container_name: contract-test-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - contract-test-network
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  mlflow_data:
  prometheus_data:
  grafana_data:

networks:
  contract-test-network:
    driver: bridge
